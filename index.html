  /* ---------- 交互 ---------- */
  function findEntry(exId) {
    const s = currentSession();
    return s && s.entries.find(e => e.exerciseId === exId);
  }

  function start(type, copy) {
    if (activeSession()) { ui.sessionId = activeSession().id; ui.screen = 'session'; render(); return; }
    const s = C.startSession(DB, type, { copyLast: !!copy });
    s.entries.forEach(e => C.prefillFromLast(DB, e));
    s.entries.forEach(e => { if (!e.sets.length) C.addSet(e, { w: defaultWeight(C.getExercise(DB, e.exerciseId)) }); });
    ui.sessionId = s.id;
    ui.screen = 'session';
    save(); snapshot();
    acquireWake();
    render();
  }

  function finish() {
    const s = currentSession();
    if (!s) return;
    const noteEl = document.querySelector('[data-session-note]');
    if (noteEl) s.note = noteEl.value;
    if (ui.timer) recordRest();
    C.finishSession(s);
    releaseWake();
    save();
    ui.sessionId = null;
    ui.detailId = s.id;
    ui.screen = isOn('summary') ? 'summary' : 'home';
    toast('训练已保存');
    render();
  }

  function openSession(id) {
    ui.detailId = id;
    ui.screen = 'summary';
    render();
  }

  function deleteSession(id) {
    DB.sessions = DB.sessions.filter(s => s.id !== id);
    save();
    ui.screen = 'history';
    toast('已删除');
    render();
  }

  function onAction(el) {
    const act = el.dataset.act;
    const exId = el.dataset.ex;
    const idx = el.dataset.i != null ? Number(el.dataset.i) : null;
    if (!act) return;

    if (act.indexOf('nav-') === 0) { ui.screen = act.slice(4); ui.sessionId = null; render(); return; }
    if (act === 'start') { start(el.dataset.type, false); return; }
    if (act === 'start-copy') { start(el.dataset.type, true); return; }
    if (act === 'resume') { ui.sessionId = activeSession().id; ui.screen = 'session'; acquireWake(); render(); return; }
    if (act === 'leave') { ui.screen = activeSession() ? 'home' : 'home'; render(); return; }
    if (act === 'finish') { ui.modal = { title: '结束训练？', text: '结束后仍可修改历史数据（通过导入），但本次训练会进入已结束状态。', act: 'do-finish' }; render(); return; }
    if (act === 'add-exercise') { ui.picker = true; render(); return; }
    if (act === 'close-sheet') { ui.picker = false; render(); return; }
    if (act === 'pick-exercise') {
      const s = currentSession();
      const t = (DB.templates[s.dayType] || []).find(x => x.exerciseId === el.dataset.id);
      const e = C.makeEntry(DB, el.dataset.id, t);
      C.prefillFromLast(DB, e);
      if (!e.sets.length) C.addSet(e, { w: defaultWeight(C.getExercise(DB, el.dataset.id)) });
      s.entries.push(e);
      ui.picker = false;
      save(); render(); return;
    }
    if (act === 'remove-exercise') {
      const s = currentSession();
      pushUndo();
      s.entries = s.entries.filter(e => e.exerciseId !== exId);
      save(); toast('已移除动作', false, true); render(); return;
    }
    if (act === 'add-set') { C.addSet(findEntry(exId)); save(); render(); return; }
    if (act === 'del-set') {
      const e = findEntry(exId); pushUndo();
      e.sets.splice(idx, 1); save(); toast('已删除一组', false, true); render(); return;
    }
    if (act === 'toggle-type') {
      const e = findEntry(exId), st = e.sets[idx];
      if (!isOn('warmup')) return;
      st.type = st.type === 'warmup' ? 'work' : 'warmup';
      save(); render(); return;
    }
    if (act === 'toggle-side') {
      const e = findEntry(exId), st = e.sets[idx];
      st.side = st.side == null ? 'L' : st.side === 'L' ? 'R' : null;
      save(); render(); return;
    }
    if (act === 'toggle-done') {
      const e = findEntry(exId), st = e.sets[idx];
      st.done = !st.done;
      if (st.done) {
        if (st.type === 'work') { startRest(e, idx); diagnose(e); }
        vibrate(15);
      } else {
        if (ui.timer && ui.timer.entryId === exId && ui.timer.setIndex === idx) recordRest();
      }
      save(); render(); return;
    }
    if (act === 'inc-w' || act === 'dec-w') {
      const e = findEntry(exId), st = e.sets[idx];
      const step = ui.fine ? 0.5 : 2.5;
      st.w = Math.max(0, C.round1(st.w + (act === 'inc-w' ? step : -step)));
      ui.fine = false; save(); render(); return;
    }
    if (act === 'inc-r' || act === 'dec-r') {
      const e = findEntry(exId), st = e.sets[idx];
      st.r = Math.max(1, st.r + (act === 'inc-r' ? 1 : -1));
      save(); render(); return;
    }
    if (act === 'warmup-ramp') {
      const e = findEntry(exId);
      const first = e.sets.find(s => s.type === 'work');
      const base = first ? first.w : 20;
      const ramp = C.warmupRamp(base);
      ramp.forEach(r => e.sets.unshift({ w: r.w, r: r.r, type: 'warmup', side: null, rpe: null, done: false }));
      save(); toast('已添加热身组'); render(); return;
    }
    if (act === 'goal') {
      const cur = DB.goals.find(g => g.exerciseId === exId);
      const w = prompt('目标重量（kg）', cur ? cur.weight : 60);
      if (w == null) return;
      const r = prompt('目标次数', cur ? cur.reps : 8);
      if (r == null) return;
      DB.goals = DB.goals.filter(g => g.exerciseId !== exId);
      DB.goals.push({ exerciseId: exId, weight: Number(w) || 0, reps: Number(r) || 1 });
      save(); render(); return;
    }
    if (act === 'advice-adopt' || act === 'advice-ignore') {
      const e = findEntry(exId);
      const a = (e.advice || []).filter(x => x.accepted == null).slice(-1)[0];
      if (!a) return;
      a.accepted = act === 'advice-adopt';
      if (a.accepted) {
        if (a.kind === 'weight' && a.weightRange) {
          let target = e.sets.find(s => !s.done && s.type === 'work');
          if (target) target.w = a.weightRange[0];
          else C.addSet(e, { w: a.weightRange[0], r: (e.planned && e.planned.repMin) || 8 });
        }
        if (a.kind === 'rest' && ui.timer && a.restTo) {
          ui.timer.planned = a.restTo;
          ui.timer.endAt = ui.timer.startAt + a.restTo * 1000;
          ui.timer.over = false;
          saveTimer();
        }
      }
      save(); render(); return;
    }
    if (act === 'timer-stop') { recordRest(); render(); return; }
    if (act === 'timer-plus' || act === 'timer-plus60' || act === 'timer-minus') {
      if (!ui.timer) return;
      const d = act === 'timer-plus' ? 30 : act === 'timer-plus60' ? 60 : -30;
      if (d > 0) { ui.timer.endAt += d * 1000; ui.timer.over = false; }
      else ui.timer.endAt = Math.max(Date.now() + 5000, ui.timer.endAt - 30000);
      ui.timer.adjusts.push({ delta: d, at: C.nowIso() });
      saveTimer(); renderTimer(); return;
    }
    if (act === 'open-template') { ui.screen = 'template'; render(); return; }
    if (act === 'tpl-day') { ui.tplDay = el.dataset.day; render(); return; }
    if (act === 'tpl-up' || act === 'tpl-down') {
      const tpl = DB.templates[ui.tplDay];
      const i = Number(el.dataset.i), j = act === 'tpl-up' ? i - 1 : i + 1;
      if (j < 0 || j >= tpl.length) return;
      const tmp = tpl[i]; tpl[i] = tpl[j]; tpl[j] = tmp;
      save(); render(); return;
    }
    if (act === 'tpl-del') { DB.templates[ui.tplDay].splice(Number(el.dataset.i), 1); save(); render(); return; }
    if (act === 'tpl-add') {
      const sel = document.getElementById('tplAddEx');
      if (!sel) return;
      const tpl = DB.templates[ui.tplDay];
      if (tpl.some(x => x.exerciseId === sel.value)) { toast('模板里已有这个动作', true); return; }
      tpl.push({ exerciseId: sel.value, sets: 3, repMin: 8, repMax: 12, restSec: 90 });
      save(); toast('已添加'); render(); return;
    }
    if (act === 'edit-exercise') { ui.exEdit = el.dataset.id; render(); return; }
    if (act === 'close-ex-edit') { ui.exEdit = null; render(); return; }
    if (act === 'save-exercise') {
      const ex = DB.exercises.find(x => x.id === el.dataset.id);
      if (!ex) return;
      const name = (document.getElementById('exName') || {}).value || ex.name;
      const muscle = (document.getElementById('exMuscle') || {}).value || ex.muscle;
      const equipment = (document.getElementById('exEquipment') || {}).value || ex.equipment;
      const uni = !!(document.getElementById('exUnilateral') || {}).checked;
      ex.name = name.trim() || ex.name;
      ex.muscle = muscle;
      ex.equipment = equipment;
      ex.unilateral = uni;
      save(); ui.exEdit = null; toast('已保存'); render(); return;
    }
    if (act === 'open-exercise') { ui.exId = el.dataset.id; ui.screen = 'exercise'; render(); return; }
    if (act === 'open-session') { openSession(el.dataset.id); return; }
    if (act === 'delete-session') { ui.modal = { title: '删除这次训练？', text: '该记录会从历史中移除，且无法恢复。', act: 'do-delete-session', id: el.dataset.id }; render(); return; }
    if (act === 'week-prev') { ui.weekOffset--; render(); return; }
    if (act === 'week-next') { ui.weekOffset++; render(); return; }
    if (act === 'preset') { C.applyPreset(DB, el.dataset.preset); save(); toast('已切换预设'); render(); return; }
    if (act === 'toggle-feature') {
      const f = C.FEATURES.find(x => x.id === el.dataset.id);
      if (!f || f.locked) return;
      DB.settings.features[f.id] = !isOn(f.id);
      DB.settings.preset = 'custom';
      save(); render(); return;
    }
    if (act === 'theme') { DB.settings.theme = el.dataset.theme; save(); render(); return; }
    if (act === 'font') { DB.settings.fontScale = Number(el.dataset.v); save(); render(); return; }
    if (act === 'export') { doExport(); return; }
    if (act === 'import') { document.getElementById('importFile').click(); return; }
    if (act === 'demo') { ui.modal = { title: '载入示例数据？', text: '会清空当前训练记录并生成 6 周示例。', act: 'do-demo' }; render(); return; }
    if (act === 'reset') { ui.modal = { title: '清空所有数据？', text: '训练、动作、设置都会恢复初始状态。建议先导出。', act: 'do-reset' }; render(); return; }
    if (act === 'add-exercise-lib') {
      const name = (document.getElementById('newExName') || {}).value || '';
      const muscle = (document.getElementById('newExMuscle') || {}).value || 'other';
      const equipment = (document.getElementById('newExEquipment') || {}).value || 'other';
      const uni = !!(document.getElementById('newExUnilateral') || {}).checked;
      if (!name.trim()) { toast('请输入动作名称', true); return; }
      DB.exercises.push({ id: C.uid('ex'), name: name.trim(), muscle, equipment, unilateral: uni, custom: true });
      save(); toast('已添加'); render(); return;
    }
    if (act === 'del-exercise') {
      DB.exercises = DB.exercises.filter(e => e.id !== el.dataset.id);
      save(); render(); return;
    }
    if (act === 'add-bodyweight') {
      const v = prompt('体重（kg）');
      if (v == null) return;
      DB.bodyweights.push({ date: C.localDate(), kg: Number(v) || 0 });
      save(); render(); return;
    }
    if (act === 'undo') {
      if (!undoSave) return;
      try { DB = JSON.parse(undoSave); undoSave = null; save(); toast('已撤销'); render(); } catch (e) { toast('撤销失败', true); }
      return;
    }
    if (act === 'modal-no') { ui.modal = null; render(); return; }
    if (act === 'modal-yes') {
      const m = ui.modal; ui.modal = null;
      if (!m) { render(); return; }
      if (m.act === 'do-finish') finish();
      else if (m.act === 'do-delete-session') deleteSession(m.id);
      else if (m.act === 'do-reset') { DB = C.seedDB(); save(); toast('已重置'); ui.screen = 'home'; render(); }
      else if (m.act === 'do-demo') { loadDemo(); render(); }
      return;
    }
  }

  function diagnose(e) {
    if (!isOn('intraSetAdvice')) return;
    const s = currentSession();
    if (!s) return;
    const h = C.historyFor(DB, e.exerciseId, s.id);
    const a = C.diagnose(e, h);
    if (!a) return;
    e.advice = e.advice || [];
    e.advice.push({ at: C.nowIso(), kind: a.kind, accepted: null, text: a.text, weightRange: a.weightRange || null, restTo: a.restTo || null, setIndex: a.setIndex, prevR: a.prevR, curR: a.curR, drop: a.drop, threshold: a.threshold });
    save();
  }

  /* ---------- 数据操作 ---------- */
  function doExport() {
    const payload = { app: 'fitness-log', version: C.VERSION, exportedAt: C.nowIso(), data: DB };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fitness-log-' + C.localDate().replace(/-/g, '') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    DB.settings.lastExportAt = C.nowIso();
    save();
    toast('已导出');
    render();
  }

  function doImport(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        const err = C.validateImport(obj);
        if (err) { toast('导入失败：' + err, true); return; }
        pushUndo();
        snapshot();
        const added = C.mergeImport(DB, obj);
        save();
        toast('导入完成，新增 ' + added + ' 条训练');
        render();
      } catch (e) { toast('导入失败：文件不是合法 JSON', true); }
    };
    reader.readAsText(file);
  }

  function loadDemo() {
    DB.sessions = [];
    ui.timer = null;
    ui.sessionId = null;
    saveTimer();
    const today = new Date();
    const monday = C.startOfWeek(today);
    const base = { bench_bar: 40, incline_db: 16, fly_cable: 20, lateral_db: 8, pushdown: 25, pullup: 0, row_bar: 40, pulldown: 40, facepull: 15, curl_db: 10, squat_bar: 60, rdl: 50, legpress: 100, legcurl: 30, calf: 40 };
    for (let w = 5; w >= 0; w--) {
      ['tue', 'wed', 'thu'].forEach((key, di) => {
        const d = C.addDays(monday, -w * 7 + di + 1);
        if (C.localDate(d) > C.localDate(today)) return;
        const dayType = DB.weekPlan[key];
        if (!dayType) return;
        const s = { id: C.localDate(d) + '-' + dayType + '-demo', date: C.localDate(d), dayType, status: 'finished', startedAt: C.localDate(d) + 'T19:00:00+08:00', endedAt: C.localDate(d) + 'T20:05:00+08:00', note: '', entries: [] };
        (DB.templates[dayType] || []).forEach(t => {
          const e = C.makeEntry(DB, t.exerciseId, t);
          const scale = (6 - w) / 6;
          const baseW = base[t.exerciseId] || 20;
          const weight = Math.max(2.5, C.floor25(baseW * (0.85 + 0.25 * scale)));
          const reps = [8, 8, 7, 7].slice(0, t.sets);
          e.sets = reps.map((r, i) => ({ w: weight, r: r - (i > 1 ? 0 : 0), type: 'work', side: null, rpe: null, done: true, rest: { planned: t.restSec, actual: t.restSec - 10, adjusts: [] } }));
          s.entries.push(e);
        });
        DB.sessions.push(s);
      });
    }
    DB.sessions.sort((a, b) => (a.startedAt || '').localeCompare(b.startedAt || ''));
    save();
    toast('示例数据已载入');
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', e => {
    if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
    const el = e.target.closest('[data-act]');
    if (el) { e.preventDefault(); onAction(el); }
  });

  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-act="inc-w"],[data-act="dec-w"]');
    if (!el) return;
    pressTimer = setTimeout(() => { ui.fine = true; vibrate(10); }, 550);
  });
  document.addEventListener('pointerup', () => { clearTimeout(pressTimer); });
  document.addEventListener('contextmenu', e => { if (e.target.closest('.stepper')) e.preventDefault(); });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-rpe]')) {
      const e2 = findEntry(t.dataset.ex);
      const st = e2 && e2.sets[Number(t.dataset.i)];
      if (st) { st.rpe = t.value === '' ? null : Number(t.value); save(); render(); }
      return;
    }
    if (t.id === 'compareN') { DB.settings.compareN = Number(t.value); save(); render(); return; }
    if (t.id === 'restCompound') { DB.settings.restTimer.compound = Math.max(30, Number(t.value) || 180); save(); return; }
    if (t.id === 'restIsolation') { DB.settings.restTimer.isolation = Math.max(30, Number(t.value) || 90); save(); return; }
    if (t.id === 'statsEx') { ui.statsEx = t.value; render(); return; }
    if (t.id === 'importFile' && t.files && t.files[0]) { doImport(t.files[0]); t.value = ''; return; }
    if (t.matches('[data-week-day]')) {
      DB.weekPlan[t.dataset.weekDay] = t.value || null;
      save();
      return;
    }
    if (t.matches('[data-tpl-field]')) {
      const tpl = DB.templates[ui.tplDay];
      const item = tpl && tpl.find(x => x.exerciseId === t.dataset.tplEx);
      if (item) {
        const v = Number(t.value);
        if (!isNaN(v)) item[t.dataset.tplField] = Math.max(0, Math.round(v));
        save();
      }
      return;
    }
    if (t.matches('[data-session-note]')) {
      const s = currentSession();
      if (s) { s.note = t.value; save(); }
      return;
    }
    if (t.matches('[data-note-ex]')) {
      const e2 = findEntry(t.dataset.noteEx);
      if (e2) { e2.note = t.value; save(); }
      return;
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && activeSession() && isOn('wakeLock')) acquireWake();
  });

  /* ---------- 启动 ---------- */
  load();
  loadTimer();
  if (DB.sessions.some(s => s.status === 'in_progress')) ui.screen = 'home';
  applyTheme();
  render();
  tick = setInterval(tickFn, 500);

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
})();

</script>
</body>
</html>
